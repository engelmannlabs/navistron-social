name: Renderizar artes dos posts

on:
  push:
    branches: [main]
    paths:
      - "posts/**/post.html"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      all:
        description: "Re-renderizar todos os posts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Fontes (woff2 via npm/fontsource)
        run: bash scripts/setup-fonts.sh

      - name: Renderizar
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then node scripts/render.mjs --all; else node scripts/render.mjs; fi

      - name: Commit das imagens
        run: |
          git config user.name "navistron-render[bot]"
          git config user.email "render@navistron.io"
          git add -A assets/fonts posts
          if git diff --cached --quiet; then echo "nada a commitar"; exit 0; fi
          git commit -m "render: artes atualizadas [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
