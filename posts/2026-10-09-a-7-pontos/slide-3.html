<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="post-size" content="1080x1440">
<link rel="stylesheet" href="../../templates/base.css">
<style>
  .rank { top: 620px; gap: 16px; }
  .row { padding: 18px 30px; }
  .row .pos { font-size: 54px; }
  .row .name { font-size: 32px; }
  .row .score { font-size: 60px; }
  .row.ten { background: rgba(250,204,21,0.08); border-color: rgba(250,204,21,0.5); box-shadow: 0 0 34px rgba(250,204,21,0.14); }
  .row.ten .pos, .row.ten .score { color: var(--t3); }
  .line-cut { display: flex; align-items: center; gap: 18px; font-size: 16px; letter-spacing: 0.3em; color: var(--t3); text-transform: uppercase; margin: 2px 0; }
  .line-cut::before, .line-cut::after { content: ""; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, rgba(250,204,21,0.7) 0 10px, transparent 10px 18px); }
  .row.anon { background: repeating-linear-gradient(-45deg, rgba(251,146,60,0.07) 0 8px, transparent 8px 18px);
              border: 2px dashed rgba(251,146,60,0.6); }
  .row.anon .pos, .row.anon .name { color: var(--t4); }
  .row.anon .score { color: var(--t4); text-shadow: 0 0 24px rgba(251,146,60,0.4); }
  .note { position: absolute; left: 100px; right: 100px; top: 1196px; text-align: center; font-family: var(--font-ui);
          font-size: 27px; line-height: 1.45; color: var(--muted); }
  .note b { color: var(--ink); font-weight: 600; }
</style>
