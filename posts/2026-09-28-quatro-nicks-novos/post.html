<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="post-type" content="reel">
<meta name="post-size" content="1080x1920">
<meta name="reel-duration" content="14.0">
<meta name="reel-fps" content="30">
<meta name="reel-cover" content="2.0">
<link rel="stylesheet" href="../../templates/reel.css">
<style>
  .rkline { display: flex; align-items: baseline; gap: 30px; font-family: var(--font-mono); font-size: 64px;
            line-height: 1.1; margin-top: 34px; opacity: 0; }
  .rkline .pos { width: 86px; text-align: left; font-weight: 800; color: var(--t1); }
  .rkline.top .pos { color: var(--t3); text-shadow: 0 0 30px rgba(250,204,21,0.5); }
  .rkline .nick { flex: 1; text-align: left; letter-spacing: 0.06em; color: var(--ink); }
  .rkline .sc { font-weight: 800; color: var(--t3); font-variant-numeric: tabular-nums; }
</style>
<!-- dados: navistron.io/stats?periodo=7d lido em 28/09/2026 ~01:15 BRT (semana 39 ISO, 21 a 27/09):
     20 partidas, 5 pilotos com nick, 10 registradas e 10 anonimas, 34min52 no total, media 1m45,
     score medio 5.650, maior score 19.785. Top 5 da semana: AMM2026 19.785 / ROBER 11.195 / DENISE 6.768 /
     YAGO 5.865 / XXXX 799. Quatro nicks novos na semana (DENISE 22/09, ROBER e YAGO 24/09, XXXX 25/09),
     levando o total de pilotos de 40 para 44. Conferencia: soma das 20 duracoes = 2.092 s = 34min52 (bate com o
     site) e soma dos scores / 20 = 5.650,35 (bate com a media). Total geral segue 528: 26 e 27/09 sem jogo. -->
</head>
<body>
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>

  <div class="brand"><span class="dot"></span>Telemetria pública · @navistron</div>

  <div id="title" class="layer" style="top: 420px">
    <div class="h1" style="font-size: 168px"><span class="w" id="w1">QUATRO NICKS</span><br><span class="w" id="w2">NOVOS EM</span><br><span class="w accent" id="w3">UMA SEMANA.</span></div>
  </div>

  <div id="rec" class="layer" style="top: 600px">
    <div class="kicker" id="reclabel">O TOPO DA SEMANA 39</div>
    <div class="counter" id="num" style="margin-top: 40px">0</div>
    <div class="sub" id="who" style="margin-top: 36px; opacity: 0"><b>AMM2026</b> · 23/09 · 3min10</div>
    <div id="second" style="margin-top: 70px; opacity: 0"><span class="marker">20 partidas em <b>4 tardes</b></span></div>
  </div>

  <div id="dur" class="layer" style="top: 560px">
    <div class="kicker">o top 5 da semana</div>
    <div id="rk" style="margin-top: 60px">
      <div class="rkline top" id="r1"><span class="pos">1</span><span class="nick">AMM2026</span><span class="sc">19.785</span></div>
      <div class="rkline" id="r2"><span class="pos">2</span><span class="nick">ROBER</span><span class="sc">11.195</span></div>
      <div class="rkline" id="r3"><span class="pos">3</span><span class="nick">DENISE</span><span class="sc">6.768</span></div>
      <div class="rkline" id="r4"><span class="pos">4</span><span class="nick">YAGO</span><span class="sc">5.865</span></div>
      <div class="rkline" id="r5"><span class="pos">5</span><span class="nick">XXXX</span><span class="sc">799</span></div>
    </div>
  </div>

  <div id="ask" class="layer" style="top: 560px">
    <div class="h1" style="font-size: 168px">VOCÊ ENTRA<br><span class="cyan">NO TOP 5?</span></div>
  </div>

  <div id="cta" class="layer" style="top: 700px">
    <div class="cta-big">NAVISTRON<br>.IO</div>
    <div class="cta-sub">grátis, sem login</div>
    <div class="cta-handle">@navistron</div>
  </div>

<script>
(function () {
  const W = 1080, H = 1920;
  const DUR = 14.0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = { out3: p => 1 - Math.pow(1 - p, 3), out4: p => 1 - Math.pow(1 - p, 4), inout: p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2 };
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);
  const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const clk = v => { v = Math.max(0, Math.round(v)); return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0'); };

  // ---------- PRNG determinístico ----------
  let s = 2809;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };

  // ---------- fundo estático ----------
  const bg = document.getElementById('bg').getContext('2d');
  for (let i = 0; i < 1500; i++) {
    const x = rnd() * W, y = rnd() * H, r = 0.4 + rnd() * 1.0, a = 0.10 + rnd() * 0.35;
    bg.fillStyle = `rgba(210,225,255,${a})`; bg.beginPath(); bg.arc(x, y, r, 0, Math.PI * 2); bg.fill();
  }
  for (let i = 0; i < 40; i++) {
    const x = rnd() * W, y = rnd() * H, r = 1.4 + rnd() * 1.6;
    const g = bg.createRadialGradient(x, y, 0, x, y, r * 5);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.35, 'rgba(180,210,255,0.35)'); g.addColorStop(1, 'rgba(180,210,255,0)');
    bg.fillStyle = g; bg.beginPath(); bg.arc(x, y, r * 5, 0, Math.PI * 2); bg.fill();
  }

  // ---------- meteoros ----------
  const N = 72, meteors = [];
  for (let i = 0; i < N; i++) {
    const n = 8 + Math.floor(rnd() * 5), shape = [];
    for (let k = 0; k < n; k++) shape.push(0.72 + rnd() * 0.28);
    meteors.push({
      x: rnd() * W, v: 260 + rnd() * 220, r: 22 + rnd() * 46, rot: rnd() * 6.28, w: (rnd() - .5) * 2.4,
      phase: rnd() * 2100, drift: (rnd() - .5) * 60, shape, big: rnd() < 0.35
    });
  }
  const fx = document.getElementById('fx').getContext('2d');
  function drawMeteor(m, x, y, rot, glow) {
    fx.save(); fx.translate(x, y); fx.rotate(rot);
    fx.beginPath();
    const n = m.shape.length;
    for (let k = 0; k < n; k++) {
      const ang = (k / n) * Math.PI * 2, rr = m.r * m.shape[k];
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      k ? fx.lineTo(px, py) : fx.moveTo(px, py);
    }
    fx.closePath();
    fx.fillStyle = m.big ? 'rgba(20,26,46,0.92)' : 'rgba(14,19,36,0.9)';
    fx.fill();
    fx.lineWidth = m.big ? 3 : 2;
    fx.strokeStyle = glow ? 'rgba(250,204,21,0.9)' : (m.big ? 'rgba(190,208,240,0.75)' : 'rgba(150,170,205,0.6)');
    if (glow) { fx.shadowColor = 'rgba(250,204,21,0.8)'; fx.shadowBlur = 24; }
    fx.stroke();
    fx.restore();
  }
  function drawShip(x, y, t) {
    const flick = 0.6 + 0.4 * Math.abs(Math.sin(t * 41));
    fx.save(); fx.translate(x, y);
    const g = fx.createLinearGradient(0, 30, 0, 30 + 90 * flick);
    g.addColorStop(0, 'rgba(34,211,238,0.9)'); g.addColorStop(1, 'rgba(34,211,238,0)');
    fx.fillStyle = g; fx.beginPath(); fx.moveTo(-12, 30); fx.lineTo(12, 30); fx.lineTo(0, 30 + 90 * flick); fx.closePath(); fx.fill();
    fx.shadowColor = 'rgba(34,211,238,0.7)'; fx.shadowBlur = 30;
    fx.fillStyle = '#EEF3FF'; fx.beginPath(); fx.moveTo(0, -46); fx.lineTo(34, 30); fx.lineTo(0, 14); fx.lineTo(-34, 30); fx.closePath(); fx.fill();
    fx.fillStyle = '#22D3EE'; fx.beginPath(); fx.moveTo(0, -20); fx.lineTo(10, 12); fx.lineTo(-10, 12); fx.closePath(); fx.fill();
    fx.restore();
  }
  const shipX = t => 540 + 150 * Math.sin(t * 0.9 + 3.6) + 60 * Math.sin(t * 2.3);
  const shipY = 1400;

  const HIT = 5.2;
  function drawFX(t) {
    fx.clearRect(0, 0, W, H);
    const p = seg(t, 0, 12.5);
    const active = Math.floor(10 + 62 * p * p);
    const speed = 1 + 1.6 * p;
    for (let i = 0; i < active; i++) {
      const m = meteors[i];
      const dist = (t * m.v * speed + m.phase);
      const cycle = Math.floor(dist / 2100);
      const y = (dist % 2100) - 120;
      const x = ((m.x + cycle * 617 + m.drift * (y / 1000)) % W + W) % W;
      const glow = (t > HIT && t < HIT + 0.7 && i % 5 === 0);
      drawMeteor(m, x, y, m.rot + t * m.w, glow);
    }
    fx.save();
    for (let k = 0; ; k++) {
      const tb = k * 0.12; if (tb > t) break;
      const yb = shipY - 50 - (t - tb) * 1500; if (yb < -30) continue;
      const xb = shipX(tb);
      fx.fillStyle = 'rgba(34,211,238,0.95)'; fx.shadowColor = 'rgba(34,211,238,0.9)'; fx.shadowBlur = 14;
      fx.fillRect(xb - 3, yb, 6, 26);
    }
    fx.restore();
    drawShip(shipX(t), shipY, t);
    const vg = fx.createRadialGradient(540, 900, 200, 540, 900, 1100);
    vg.addColorStop(0, 'rgba(5,7,15,0.55)'); vg.addColorStop(1, 'rgba(5,7,15,0)');
    fx.fillStyle = vg; fx.fillRect(0, 0, W, H);
  }

  // ---------- camadas de texto ----------
  const $ = id => document.getElementById(id);
  const layer = (el, op, dy = 0, sc = 1) => { el.style.opacity = op; el.style.transform = `translateY(${dy}px) scale(${sc})`; };
  const TOTAL = 19785;

  window.__seek = function (t) {
    t = clamp(t, 0, DUR);
    drawFX(t);
    // 1) gancho em 3 tempos (0–1.15), some em 2.3–2.7
    const outT = 1 - seg(t, 2.3, 0.4);
    layer($('title'), outT, -30 * (1 - outT));
    const ws = [['w1', -0.15, 0.28], ['w2', 0.32, 0.32], ['w3', 0.72, 0.42]];
    for (const [id, a, d] of ws) {
      const v = ease.out3(seg(t, a, d));
      $(id).style.opacity = v; $(id).style.display = 'inline-block'; $(id).style.transform = `translateY(${40 * (1 - v)}px)`;
    }

    // 2) score do topo da semana: entra 2.6, conta até 5.2, trava, sai 6.9–7.2
    const inR = ease.out3(seg(t, 2.6, 0.45)), outR = 1 - seg(t, 6.9, 0.3);
    layer($('rec'), inR * outR, 30 * (1 - inR));
    const cp = 1 - Math.pow(1 - seg(t, 2.7, HIT - 2.7), 2.2);
    const locked = t >= HIT;
    $('num').textContent = fmt(locked ? TOTAL : TOTAL * cp);
    $('num').className = 'counter' + (locked ? ' lock' : '');
    const pulse = locked ? 1 + 0.07 * Math.exp(-(t - HIT) * 4) : 1;
    $('num').style.transform = `scale(${pulse})`;
    const whoIn = ease.out3(seg(t, HIT + 0.05, 0.4));
    $('who').style.opacity = whoIn; $('who').style.transform = `translateY(${20 * (1 - whoIn)}px)`;
    const secIn = ease.out3(seg(t, HIT + 0.75, 0.45));
    $('second').style.opacity = secIn; $('second').style.transform = `translateY(${24 * (1 - secIn)}px)`;

    // 3) top 5 da semana 7.2–10.9 (uma linha a cada 0,28 s)
    const inD = ease.out3(seg(t, 7.2, 0.4)), outD = 1 - seg(t, 10.6, 0.3);
    layer($('dur'), inD * outD, 30 * (1 - inD));
    for (let i = 1; i <= 5; i++) {
      const v = ease.out3(seg(t, 7.5 + (i - 1) * 0.28, 0.36));
      const el = $('r' + i);
      el.style.opacity = v; el.style.transform = `translateX(${34 * (1 - v)}px)`;
    }

    // 4) pergunta 10.95–12.2
    const inA = ease.out3(seg(t, 10.95, 0.4)), outA = 1 - seg(t, 12.0, 0.3);
    layer($('ask'), inA * outA, 0, 0.92 + 0.08 * inA);

    // 5) CTA 12.3–14.0
    const inC = ease.out3(seg(t, 12.3, 0.5));
    layer($('cta'), inC, 30 * (1 - inC));
  };
  window.__duration = DUR;
  window.__seek(0);
})();
</script>
</body>
</html>
