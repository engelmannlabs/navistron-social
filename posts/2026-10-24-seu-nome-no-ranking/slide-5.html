<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="post-size" content="1080x1440">
<link rel="stylesheet" href="../../templates/base.css">
<style>
  .title { font-size: 190px; line-height: 0.88; }
  .btns { position: absolute; left: 50%; top: 690px; transform: translateX(-50%); width: 760px; display: flex; flex-direction: column;
          gap: 26px; align-items: stretch; text-align: center; }
  .b1 { padding: 36px 0; border-radius: 12px; background: var(--t3); color: #05070F; font-family: var(--font-ui); font-weight: 500;

  .b1 small { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 17px; letter-spacing: 0.24em; opacity: 0.75; }
  .b2 { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 20px 0; border-radius: 12px;
        border: 2px dashed rgba(143,163,199,0.32); color: var(--dim); font-family: var(--font-ui); font-size: 24px; letter-spacing: 0.14em; }
  .b2 s { color: var(--muted); }
  .b2 em { font-style: normal; font-family: var(--font-mono); font-size: 16px; letter-spacing: 0.2em; color: var(--muted); }
  .lead { position: absolute; left: 96px; right: 96px; top: 1064px; text-align: center; font-family: var(--font-ui);
          font-size: 30px; line-height: 1.45; color: var(--muted); }
  .lead b { color: var(--ink); font-weight: 600; }
  .sub { position: absolute; left: 72px; right: 72px; bottom: 88px; text-align: center; font-size: 18px;
         letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  .sub b { color: var(--t3); }
</style>

</head>

  <canvas id="stars" width="1080" height="1440" data-seed="20261028" data-core="30,40,1050,1400"></canvas>
