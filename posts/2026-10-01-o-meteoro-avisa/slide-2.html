<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="post-size" content="1080x1440">
<link rel="stylesheet" href="../../templates/base.css">
<style>
  .lead { position: absolute; left: 110px; right: 110px; top: 600px; text-align: center; font-family: var(--font-ui);
          font-size: 32px; line-height: 1.45; color: var(--muted); }
  .lead b { color: var(--ink); font-weight: 600; }
  #m { position: absolute; left: 0; top: 820px; }
  .steps { position: absolute; left: 72px; right: 72px; top: 1010px; display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .steps .n { font-family: var(--font-display); font-weight: 700; font-size: 58px; line-height: 1; color: var(--ink); }
  .steps .p { margin-top: 10px; font-size: 21px; letter-spacing: 0.04em; color: var(--muted); }
  .steps .last .n { color: var(--t4); text-shadow: 0 0 24px rgba(251,146,60,0.5); }
  .legend { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; font-size: 18px; letter-spacing: 0.2em;
            color: var(--dim); text-transform: uppercase; }
</style>
<!-- Slide 2 de 5. Limiares (lv = ceil((1 - hp/maxHp) * 7)): a k-ésima rachadura acende quando a vida perdida passa de
     (k-1)/7 — 0%, 14,3%, 28,6%, 42,9%, 57,1%, 71,4%, 85,7%. Valores arredondados na arte. -->
</head>
<body>
  <canvas id="stars" width="1080" height="1440" data-seed="20261002"></canvas>
  <div class="grid"></div>

  <div class="topbar">
    <div><span class="dot"></span>Mecânica do jogo · 01.10.2026</div>
    <div>2 / 5</div>
  </div>

  <div class="head">
    <div class="kicker">7 rachaduras escondidas</div>
    <div class="title" style="font-size: 150px">UMA A CADA<br><span class="accent c4">1/7 DA VIDA.</span></div>
  </div>

  <div class="lead">Todo meteoro nasce com <b>7 rachaduras</b> guardadas. A cada sétimo da vida que ele perde, <b>mais uma acende</b>.</div>

  <canvas id="m" width="1080" height="180"></canvas>

  <div class="steps">
    <div><div class="n">1</div><div class="p">&gt;0%</div></div>
    <div><div class="n">2</div><div class="p">&gt;14%</div></div>
    <div><div class="n">3</div><div class="p">&gt;29%</div></div>
    <div><div class="n">4</div><div class="p">&gt;43%</div></div>
    <div><div class="n">5</div><div class="p">&gt;57%</div></div>
    <div><div class="n">6</div><div class="p">&gt;71%</div></div>
    <div class="last"><div class="n">7</div><div class="p">&gt;86%</div></div>
  </div>
  <div class="legend">rachaduras acesas · vida perdida</div>

  <script src="../../templates/base.js"></script>
  <script src="meteoro.js"></script>
  <script>
    const ctx = document.getElementById('m').getContext('2d');
    const colW = (1080 - 144) / 7;
    for (let i = 0; i < 7; i++) {
      drawNavMeteor(ctx, 72 + colW * (i + 0.5), 90, 58, i + 1, 41, 0.45, 2.0);
    }
  </script>
</body>
</html>
