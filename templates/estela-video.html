<!-- Camada dos vídeos da Estela — versão 2 (29/09/2026).
     Pedido do Guilherme depois da estreia: legenda menor, nada cobrindo o rosto e sobreposições temporárias e
     minimalistas. Por isso:
     - selo de IA pequeno no canto superior esquerdo, SÓ nos 3 primeiros segundos (meta video-overlay-until, some com
       fade de 0,4 s). O aviso de IA também vai na fala e no rótulo de IA do Instagram;
     - legenda pequena (56 px, caixa baixa), ancorada pela base em y = 1490: uma linha ocupa ~1420–1490 e duas linhas
       ~1350–1490, sempre abaixo do queixo (~1170 nos looks atuais) e acima da interface do Instagram;
     - mais nada fixo na tela. Não acrescentar elementos sem que sejam temporários e pequenos.
     Uso: copiar este arquivo para posts/AAAA-MM-DD-slug/post.html e trocar video-src e video-subtitles (e o reel-cover,
     se a capa pedir outro instante). O link do CSS já está relativo à pasta do post. -->
<style>
  html, body { background: transparent !important; }
  .tag { position: absolute; top: 250px; left: 64px; display: flex; align-items: center; gap: 12px;
         padding: 10px 18px; border-radius: 999px; background: rgba(5,7,15,0.5);
         font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.18em; color: rgba(255,255,255,0.92);
         text-transform: uppercase; white-space: nowrap; }
  .tag .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--t1); }
  #cap { position: absolute; left: 140px; right: 140px; bottom: 430px; text-align: center; opacity: 0; }
  #cap.on { opacity: 1; }
  #cap span { display: inline; padding: 2px 14px; line-height: 1.32; border-radius: 10px; background: rgba(5,7,15,0.55);
              -webkit-box-decoration-break: clone; box-decoration-break: clone;
              font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: 0.01em; color: #FFFFFF; }
  #cap b { color: var(--t1); font-weight: 700; }
</style>
</head>
<body>
  <div class="tag"><span class="dot"></span>Estela · IA do Navistron</div>
  <div id="cap"></div>
</body>
