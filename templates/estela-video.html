<!-- Camada dos REELS da Estela — versão 3 (29/09/2026).
     Pedidos do Guilherme depois da estreia: legenda menor, nada cobrindo o rosto, sobreposições só temporárias e
     minimalistas (v2) e, por fim, SEM selo de IA na arte — o rótulo de IA do Instagram (isAiGenerated) basta (v3).
     O que sobra por cima do vídeo é só a legenda:
     - legenda pequena (56 px, caixa baixa), ancorada pela base em y = 1490: uma linha ocupa ~1420–1490 e duas linhas
       ~1350–1490, sempre abaixo do queixo (~1170 nos looks atuais) e acima da interface do Instagram;
     - mais nada na tela. Qualquer elemento extra só se for temporário e pequeno.
     Stories usam outro molde (templates/estela-story.html): vídeo puro, sem legenda.
     Uso: copiar este arquivo para posts/AAAA-MM-DD-slug/post.html e trocar video-src e video-subtitles (e o reel-cover,
     se a capa pedir outro instante). O link do CSS já está relativo à pasta do post. -->
